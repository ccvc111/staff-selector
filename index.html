<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工选择系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .nav-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .nav-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .nav-card .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .nav-card h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .nav-card p {
            color: #666;
            font-size: 0.95rem;
        }

        .nav-card.user { border-top: 5px solid #4CAF50; }
        .nav-card.staff { border-top: 5px solid #2196F3; }
        .nav-card.admin { border-top: 5px solid #FF9800; }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .nav-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 员工选择系统</h1>
            <p>请选择您要进入的页面</p>
        </div>

        <div class="nav-cards">
            <div class="nav-card user" onclick="location.href='user.html'">
                <div class="icon">🎯</div>
                <h2>用户选人</h2>
                <p>浏览员工照片，按价格筛选，快速找到合适的人选</p>
            </div>

            <div class="nav-card staff" onclick="location.href='staff.html'">
                <div class="icon">👤</div>
                <h2>员工页面</h2>
                <p>管理您的在线状态，设置休息或在线</p>
            </div>

            <div class="nav-card admin" onclick="location.href='admin.html'">
                <div class="icon">⚙️</div>
                <h2>管理员后台</h2>
                <p>添加新员工，编辑信息，删除离职员工</p>
            </div>
        </div>
    </div>
</body>
</html>
